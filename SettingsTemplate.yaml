# yaml-language-server: $schema=https://www.flowlauncher.com/schemas/settings-template.schema.json
body:
  - type: dropdown
    attributes:
      name: interfaceLanguage
      label: Interface Language
      description: >
        Language for the plugin interface.
      options:
        - English
        - Türkçe
        - 简体中文
      defaultValue: English

  - type: textarea
    attributes:
      name: services
      label: Translate Services
      description: >
        Translation services, one per line.

        Supported services:

        Without configuration:

        Google, Youdao, Bing, DeepL

        Tencent, Transmart, Caiyun, Volcegine

        Requires configuration:

        DeepLX, MTranServer, OpenAI

      defaultValue: "google\nyoudao"

  - type: textarea
    attributes:
      name: serviceConfigs
      label: Service Configs
      description: >
        Config services that require configuration

        e.g. DeepLX, MTranServer, OpenAI

        DeepLX:

        DEEPLX_URL=xxxx

        MTranServer:

        MTRANSERVER_URL=xxxx

        MTRANSERVER_TOKEN=xxxx

        OpenAI (compatible with Azure OpenAI and other OpenAI-compatible APIs):

        OPENAI_API_KEY=sk-xxxx

        The API key is optional for services that do not require authentication.

        OPENAI_BASE_URL=https://api.openai.com

        OPENAI_MODEL=gpt-3.5-turbo

      defaultValue: ''

  - type: textarea
    attributes:
      name: openaiLanguagesMap
      label: OpenAI Languages Map
      description: >
        Optional JSON object overriding the language names used in OpenAI translation requests.

        Example: {"zh":"简体中文","en":"英语"}

        Keys must be supported language codes (including 'auto'); values must be non-empty strings.
        Omitted languages keep their built-in names. Leave blank to use all built-in names.
      defaultValue: ''

  - type: textarea
    attributes:
      name: openaiSystemPrompt
      label: OpenAI System Prompt
      description: >
        Optional instructions for translation style, terminology, and output format.

        Supports {from}, {to}, and {text}. Language placeholders use full English language names,
        or 'auto' when the source language is automatically detected by the translation service.

        Line breaks are preserved. Leave blank to use the built-in system prompt.
      defaultValue: ''

  - type: textarea
    attributes:
      name: openaiUserPrompt
      label: OpenAI User Prompt
      description: >
        Optional translation request template. Supports {from}, {to}, and {text}.

        Example: Translate the following text from {from} to {to}: {text}

        Line breaks are preserved. Custom templates must include {text}; otherwise an error is shown
        and no translation request is sent. Leave blank to use the built-in user prompt.
      defaultValue: ''

  - type: input
    attributes:
      name: proxyUrl
      label: Proxy URL
      description: >
        Proxy server URL for requests.

        Example: http://127.0.0.1:7890
      defaultValue: ''

  - type: input
    attributes:
      name: requestTimeout
      label: Request Timeout
      description: >
        Request timeout in milliseconds.

        Requests exceeding this time will be aborted.

        Services are requested together, so raise this if you use a slow proxy.
      defaultValue: '5000'

  - type: input
    attributes:
      name: translateDelay
      label: Translate Delay
      description: >
        Delay in milliseconds before sending a request.

        Useful for avoiding rate limits on some services.
      defaultValue: '700'

  - type: dropdown
    attributes:
      name: translationMode
      label: Translation Mode
      description: >
        Configured direction uses the source and target language settings below.

        Chinese ↔ English detects the main language locally and translates Chinese into English,
        or English into Simplified Chinese. Mixed text follows the detected language.

        If detection is inconclusive, text containing Chinese characters is translated into English;
        otherwise it is translated into Simplified Chinese.

        Explicit language prefixes (e.g. zh>fr, >en, en>) override this mode.
        Omitted languages in a prefix still use the source and target settings below.
      options:
        - Configured direction
        - Chinese ↔ English
      defaultValue: Configured direction

  - type: input
    attributes:
      name: sourceLanguageCode
      label: Source Language Code
      description: >
        Source language code.

        Use 'auto' for automatic detection.
      defaultValue: auto

  - type: input
    attributes:
      name: targetLanguageCode
      label: Target Language Code
      description: >
        Target language code.

        See plugin repository for language codes.
      defaultValue: en

  - type: textarea
    attributes:
      name: languagePairs
      label: Language Pairs
      description: >
        Pre-configured language pairs, one per line.

        These will be shown as quick options.

        Example: en>zh
      defaultValue: ''

  - type: input
    attributes:
      name: triggerKeyword
      label: Trigger Keyword
      description: >
        Keyword you set to trigger this plugin.

        Required when you need language pairs.
      defaultValue: tr
