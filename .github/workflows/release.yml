# .github/workflows/release.yml

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: pnpm

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: plugin.json
          prop_path: Version

      - run: echo ${{steps.version.outputs.prop}}

      # pnpm is the package manager this repository locks. Installing with npm ignored
      # pnpm-lock.yaml and resolved a second, untested dependency tree.
      # The hoisted linker is required because Flow Launcher loads node_modules from the zip, and
      # pnpm's default layout is a symlink tree into a store that would not exist on the user's
      # machine.
      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          pnpm run build
          rm -rf node_modules
          pnpm install --frozen-lockfile --prod --config.node-linker=hoisted

      # tinyld ships a playground, a browser build and a heavy profile set that no code path loads,
      # about 11 MB of the package. Only the light build is imported here, and Node needs the
      # package.json to resolve the `tinyld/light` subpath, plus the .js variant for the CJS bundle.
      - name: Prune unused tinyld files
        run: |
          cd node_modules/tinyld
          find . -mindepth 1 -maxdepth 1 ! -name package.json ! -name dist -exec rm -rf {} +
          cd dist
          find . -mindepth 1 -maxdepth 1 \
            ! -name tinyld.light.node.mjs \
            ! -name tinyld.light.node.js \
            -exec rm -rf {} +
          cd ../../..

      - name: Package plugin
        run: |
          zip -r MultiTranslate-${{steps.version.outputs.prop}}.zip . -x '*.git*'

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: 'MultiTranslate-${{steps.version.outputs.prop}}.zip'
          tag_name: 'v${{steps.version.outputs.prop}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
